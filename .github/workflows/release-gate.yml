name: Retail inMotion Release Gate

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to development and upgrade installation
        required: true
        type: boolean
        default: true
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: retailinmotion-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gate 1 - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Forge lint
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        shell: bash
        run: |
          test -n "$FORGE_EMAIL" || (echo "Missing FORGE_EMAIL" && exit 1)
          test -n "$FORGE_API_TOKEN" || (echo "Missing FORGE_API_TOKEN" && exit 1)
          npm install --global @forge/cli
          forge settings set usage-analytics false
          forge settings set default-environment development
          set +e
          forge lint 2>&1 | tee /tmp/forge-lint.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -Eq "0 errors, 0 warnings, [0-9]+ approval" /tmp/forge-lint.log; then
            echo "Forge lint: no errors or warnings; scope change requires controlled major-version approval." >> "$GITHUB_STEP_SUMMARY"
            status=0
          fi
          exit "$status"
      - name: Build evidence summary
        if: always()
        run: |
          echo "## Gate 1 — Build evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node: $(node --version)" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm: $(npm --version)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dependency mode: $([ -f package-lock.json ] && echo lockfile || echo package.json)" >> "$GITHUB_STEP_SUMMARY"

  deploy-development:
    name: Development deploy
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      RIM_SITE: retailinmotion-sandbox1.atlassian.net
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm run build
      - run: npm install --global @forge/cli
      - name: Deploy
        run: |
          forge settings set usage-analytics false
          forge settings set default-environment development
          forge deploy --environment development --approve MAJOR_VERSION_RULE --non-interactive
      - name: Upgrade development installation
        run: forge install --upgrade --site "$RIM_SITE" --product jira --environment development --confirm-scopes --non-interactive

  smoke:
    name: Gate 3 - Smoke QA
    needs: deploy-development
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: ubuntu-latest
    env:
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      RIM_SITE: retailinmotion-sandbox1.atlassian.net
    steps:
      - name: Verify Jira TEST project
        shell: bash
        run: |
          test -n "$JIRA_EMAIL" || (echo "Missing JIRA_EMAIL" && exit 1)
          test -n "$JIRA_API_TOKEN" || (echo "Missing JIRA_API_TOKEN" && exit 1)
          code=$(curl -sS -o /tmp/project.json -w "%{http_code}" -u "$JIRA_EMAIL:$JIRA_API_TOKEN" "https://$RIM_SITE/rest/api/3/project/TEST")
          echo "HTTP $code"
          test "$code" = "200" || (cat /tmp/project.json && exit 1)
          echo "Jira TEST project reachable" >> "$GITHUB_STEP_SUMMARY"

  release-summary:
    name: Release gate summary
    needs: [build, deploy-development, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          echo "# Retail inMotion release gate" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Development deploy | ${{ needs.deploy-development.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Smoke QA | ${{ needs.smoke.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Documentation, Marketplace and Commercial gates remain explicit release checks until they are backed by machine-verifiable evidence." >> "$GITHUB_STEP_SUMMARY"
