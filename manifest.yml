modules:
  jira:adminPage:
    - key: retailinmotion-customer-org-manager-admin
      resource: main
      resolver:
        function: resolver
      title: Customer & Organisation Manager
      layout: blank
  trigger:
    # Client → Organisation sync and ticket details sync. Skips the app's own edits.
    - key: org-sync-issue-events
      function: org-sync
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
      filter:
        ignoreSelf: true
  function:
    - key: resolver
      handler: index.handler
    - key: org-sync
      handler: index.handleIssueEvent
resources:
  - key: main
    path: static/dist
permissions:
  scopes:
    # Why each scope is needed: docs/SECURITY.md
    - storage:app
    - read:jira-work
    - read:jira-user
    - write:jira-work
    - read:servicedesk-request
    - manage:servicedesk-customer
    - write:customer:jira-service-management
    - write:customer.profile:jira-service-management
    - read:task:jira-service-management
    - read:customer.detail-field:jira-service-management
    - write:customer.detail:jira-service-management
    - read:customer.detail:jira-service-management
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/62238a46-6ea9-4531-81ea-315bda4df9b2
